<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>magWin</title>
  <!-- docs/static/img/logo.svg on the macOS icon grid: 824px shape inset 100px, with a soft shadow. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy=".8" stdDeviation="1" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(12.875)">
    <rect width="64" height="64" rx="14.4" fill="#d6336c" filter="url(#shadow)"/>
    <g fill="#fff">
      <rect x="11" y="11" width="27" height="27" rx="4"/>
      <g opacity=".35">
        <rect x="41" y="11" width="12" height="12" rx="3"/>
        <rect x="41" y="26" width="12" height="12" rx="3"/>
        <rect x="11" y="41" width="12" height="12" rx="3"/>
        <rect x="26" y="41" width="12" height="12" rx="3"/>
        <rect x="41" y="41" width="12" height="12" rx="3"/>
      </g>
    </g>
  </g>
</svg>
