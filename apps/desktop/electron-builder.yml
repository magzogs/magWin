# Packaging for direct distribution (Developer ID + notarization). The Mac App Store is not an
# option because OrgaWin uses private APIs. See docs/docs/development/release.md.
appId: com.magzog.magwin
productName: OrgaWin
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../../native/MagWinHelper/.build/release/MagWinHelper
    to: bin/MagWinHelper
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarizes when credentials are in the environment (pnpm release uses the orgawin-notary
  # keychain profile); without them electron-builder warns and skips notarization.
  notarize: true
  extendInfo:
    LSUIElement: true
dmg:
  title: OrgaWin
# Release files go to this repository's GitHub Releases. Releases are created as drafts and only
# reach users (and the auto-updater) once published on GitHub.
publish:
  provider: github
  owner: magzogs
  repo: orgawin
  releaseType: draft
