# Packaging for direct distribution (Developer ID + notarization). The Mac App Store is not an
# option because magWin uses private APIs. See docs/docs/development/release.md.
appId: com.magzog.magwin
productName: magWin
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../../native/MagWinHelper/.build/release/MagWinHelper
    to: bin/MagWinHelper
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    LSUIElement: true
dmg:
  title: magWin
